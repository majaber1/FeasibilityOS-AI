name: One-time Playwright remediation

on:
  push:
    branches:
      - feat/ai-decision-workspace-v1

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-decision-workspace-v1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check whether remediation is needed
        id: check
        shell: bash
        run: |
          current=$(node -p "require('./apps/web/package.json').devDependencies['@playwright/test']")
          echo "current=$current"
          if [ "$current" = "1.55.0" ]; then
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upgrade Playwright to patched version
        if: steps.check.outputs.needs_update == 'true'
        working-directory: apps/web
        run: npm install --save-dev --save-exact @playwright/test@1.55.1

      - name: Validate production dependency audit
        if: steps.check.outputs.needs_update == 'true'
        working-directory: apps/web
        run: npm audit --omit=dev

      - name: Validate frontend
        if: steps.check.outputs.needs_update == 'true'
        working-directory: apps/web
        run: |
          npm run typecheck
          npm run lint
          npm run build

      - name: Commit patched dependency files
        if: steps.check.outputs.needs_update == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json apps/web/package-lock.json
          git commit -m "fix(security): upgrade Playwright past vulnerable version [playwright-remediated]"
          git push origin HEAD:feat/ai-decision-workspace-v1
