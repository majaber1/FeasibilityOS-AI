name: CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend tests & smoke import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
      - name: Run targeted auth privilege tests first (isolate order effects)
        run: pytest tests/test_auth_privilege.py -v
      - name: Run targeted Projects auth tests first (isolate order effects)
        run: pytest tests/test_projects_auth.py -v
      - name: Run targeted health-demo tests
        run: pytest tests/test_health_demo.py -v
      - name: Run targeted auth-hardening tests
        run: pytest tests/test_auth_hardening.py -v
      - name: Run targeted router-authz tests
        run: pytest tests/test_router_authz.py -v
      - name: Run targeted migration-url tests
        run: pytest tests/test_migration_url.py -v
      - name: Run targeted CORS-config tests
        run: pytest tests/test_cors_config.py -v
      - name: Run pytest (engines + persistence + auth)
        run: pytest tests/ -v
      - name: Smoke-import FastAPI app (backend startup)
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python -c "from app.main import app; print('FastAPI app imported OK:', app.title)"
      - name: Smoke-import Vercel serverless entrypoint
        run: python -c "import importlib.util, pathlib, sys; sys.path[:0]=[str(pathlib.Path('backend')), str(pathlib.Path('financial-engine')), str(pathlib.Path('funding-engine'))]; import app.main; print('Vercel entry imports OK')"

  frontend-build:
    name: Frontend build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-fund
      - name: Production dependency audit
        run: npm audit --omit=dev
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build

  migrations:
    name: Alembic migrations on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saudi_business
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saudi_business
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: "Scenario A: fresh DB upgrade head"
        run: alembic -c database/alembic.ini upgrade head
      - name: "Scenario A: verify expected tables incl qualification"
        run: |
          python - <<'PY'
          import os, sqlalchemy as sa
          url = os.environ["DATABASE_URL"].replace("postgresql://", "postgresql+psycopg2://", 1)
          insp = sa.inspect(sa.create_engine(url))
          tables = set(insp.get_table_names())
          required = {
              "users", "organizations", "roles", "projects", "feasibility_studies",
              "financial_assumptions", "financial_results", "sensitivity_scenarios",
              "funding_programs", "idea_bank_entries",
              "franchise_opportunities",
              "multazim_requirements", "documents", "reports", "audit_logs",
              "qualification_profiles", "qualification_requirements",
              "multazim_assessment_requests", "alembic_version",
              "account_tokens",
          }
          missing = required - tables
          assert not missing, f"missing tables: {sorted(missing)}"
          discontinued = {"auctions", "auction_bids"}
          assert not (discontinued & tables), f"discontinued auction tables still present: {sorted(discontinued & tables)}"
          print("OK - all", len(required), "expected tables present; auctions removed")
          PY
      - name: "Scenario B: reset DB and upgrade to 0001_initial only"
        run: |
          python - <<'PY'
          import os, sqlalchemy as sa
          url = os.environ["DATABASE_URL"].replace("postgresql://", "postgresql+psycopg2://", 1)
          with sa.create_engine(url).begin() as c:
              c.exec_driver_sql("DROP SCHEMA public CASCADE; CREATE SCHEMA public;")
          print("public schema reset")
          PY
          alembic -c database/alembic.ini upgrade 0001_initial
      - name: "Scenario B: qualification tables absent at 0001, seed data"
        run: |
          python - <<'PY'
          import os, sqlalchemy as sa
          url = os.environ["DATABASE_URL"].replace("postgresql://", "postgresql+psycopg2://", 1)
          eng = sa.create_engine(url)
          tables = set(sa.inspect(eng).get_table_names())
          qual = {"qualification_profiles", "qualification_requirements", "multazim_assessment_requests"}
          assert "users" in tables, "original schema missing after 0001"
          assert not (qual & tables), f"qualification tables should not exist at 0001: {sorted(qual & tables)}"
          insp = sa.inspect(eng)
          proj_cols = {c["name"] for c in insp.get_columns("projects")}
          assert not ({"is_archived", "archived_at"} & proj_cols), f"archive columns must not exist at 0001: {sorted(proj_cols)}"
          print("OK - 0001 has no archive columns (frozen schema verified)")
          with eng.begin() as c:
              c.execute(
                  sa.text(
                      "INSERT INTO organizations (name, name_ar, created_at, updated_at) "
                      "VALUES (:e, :a, NOW(), NOW())"
                  ),
                  {"e": "ScenarioBCo", "a": "ScenarioBCo"},
              )
          print("OK - 0001 verified and sample org seeded")
          PY
      - name: "Scenario B: upgrade to 0002, qualification tables present, archive absent"
        run: |
          alembic -c database/alembic.ini upgrade 0002_business_qualification
          python - <<'PY'
          import os, sqlalchemy as sa
          url = os.environ["DATABASE_URL"].replace("postgresql://", "postgresql+psycopg2://", 1)
          eng = sa.create_engine(url)
          tables = set(sa.inspect(eng).get_table_names())
          qual = {"qualification_profiles", "qualification_requirements", "multazim_assessment_requests"}
          assert not (qual - tables), f"qualification tables not created: {sorted(qual - tables)}"
          cols = {c["name"] for c in sa.inspect(eng).get_columns("projects")}
          assert not ({"is_archived", "archived_at"} & cols), "archive cols at 0002"
          print("OK - 0002 has qualification tables, no archive columns")
          with eng.connect() as c:
              n = c.execute(sa.text("SELECT count(*) FROM organizations WHERE name = :e"), {"e": "ScenarioBCo"}).scalar()
          assert n == 1, f"seeded org row lost during upgrade (found {n})"
          print("OK - qualification tables added, existing data preserved")
          PY
      - name: "Cycle: head has project archive columns (0003)"
        run: |
          alembic -c database/alembic.ini upgrade head
          python - <<'PY'
          import os, sqlalchemy as sa
          url = os.environ["DATABASE_URL"].replace("postgresql://", "postgresql+psycopg2://", 1)
          cols = {c["name"] for c in sa.inspect(sa.create_engine(url)).get_columns("projects")}
          assert {"is_archived", "archived_at"} <= cols, f"archive columns missing at head: {sorted(cols)}"
          print("OK - projects has is_archived/archived_at at head")
          PY
      - name: "Cycle: downgrade to 0002 removes archive columns + everything after"
        run: |
          alembic -c database/alembic.ini downgrade 0002_business_qualification
          python - <<'PY'
          import os, sqlalchemy as sa
          url = os.environ["DATABASE_URL"].replace("postgresql://", "postgresql+psycopg2://", 1)
          insp = sa.inspect(sa.create_engine(url))
          cols = {c["name"] for c in insp.get_columns("projects")}
          assert not ({"is_archived", "archived_at"} & cols), f"archive cols should be gone: {sorted(cols)}"
          tables = set(insp.get_table_names())
          qual = {"qualification_profiles", "qualification_requirements", "multazim_assessment_requests"}
          assert not (qual - tables), "qualification tables must still exist at 0002"
          assert "investment_opportunities" not in tables, "0004 table should be gone"
          assert "sales_leads" not in tables, "0005 table should be gone"
          print("OK - downgrade to 0002 removed archive cols + 0004/0005 tables, qualification intact")
          PY
      - name: "Cycle: downgrade -1 again removes qualification tables only"
        run: |
          alembic -c database/alembic.ini downgrade -1
          python - <<'PY'
          import os, sqlalchemy as sa
          url = os.environ["DATABASE_URL"].replace("postgresql://", "postgresql+psycopg2://", 1)
          tables = set(sa.inspect(sa.create_engine(url)).get_table_names())
          qual = {"qualification_profiles", "qualification_requirements", "multazim_assessment_requests"}
          assert not (qual & tables), f"qualification tables should be gone: {sorted(qual & tables)}"
          assert "users" in tables and "organizations" in tables, "original tables must remain"
          print("OK - downgrade removed qualification tables, originals intact")
          PY
      - name: "Cycle: upgrade head restores full schema"
        run: |
          alembic -c database/alembic.ini upgrade head
          python - <<'PY'
          import os, sqlalchemy as sa
          url = os.environ["DATABASE_URL"].replace("postgresql://", "postgresql+psycopg2://", 1)
          insp = sa.inspect(sa.create_engine(url))
          tables = set(insp.get_table_names())
          qual = {"qualification_profiles", "qualification_requirements", "multazim_assessment_requests"}
          assert not (qual - tables), f"schema did not return: {sorted(qual - tables)}"
          cols = {c["name"] for c in insp.get_columns("projects")}
          assert {"is_archived", "archived_at"} <= cols, "archive columns not restored"
          print("OK - re-upgrade restored qualification schema and archive columns")
          PY

  secret-scan:
    name: Basic secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for obvious secrets
        run: |
          set -e
          PATTERN='(-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,}|xox[baprs]-[0-9A-Za-z-]{10,}|ghp_[A-Za-z0-9]{36})'
          if git grep -nIE "\$PATTERN" -- . ':(exclude).github/workflows/ci.yml'; then
            echo "::error::Potential secret found in tracked files"; exit 1
          else
            echo "No obvious secrets found."
          fi

  compose-validation:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve production stack
        env:
          POSTGRES_PASSWORD: ci-validation-password
          JWT_SECRET: ci-validation-secret-at-least-32-characters
          SMTP_HOST: smtp.example.invalid
          SMTP_FROM: no-reply@example.invalid
        run: docker compose config --quiet
