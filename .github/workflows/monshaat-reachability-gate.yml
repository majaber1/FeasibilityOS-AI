# Independent Monsha'at official Open Data API reachability probe.
# Runs on GitHub-hosted ubuntu-latest (separate egress from Cursor agents).
name: Monsha'at reachability gate

on:
  workflow_dispatch:
  # Allow one-shot pull_request runs when this file changes on the Phase 7C.1 branch.
  pull_request:
    paths:
      - ".github/workflows/monshaat-reachability-gate.yml"
      - "scripts/monshaat_reachability_probe.py"

permissions:
  contents: read

jobs:
  probe:
    name: Official API network probe (GitHub Actions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install httpx (TLS/HTTP client only)
        run: pip install "httpx==0.28.1"

      - name: Run Monsha'at official API reachability probe
        id: probe
        run: |
          python scripts/monshaat_reachability_probe.py \
            --environment "github-actions-ubuntu-latest" \
            --out monshaat_reachability_gate.json
          echo "PROBE_JSON<<EOF" >> "$GITHUB_OUTPUT"
          cat monshaat_reachability_gate.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json, sys
          data = json.load(open("monshaat_reachability_gate.json"))
          print("=== MONSHAAT NETWORK GATE SUMMARY ===")
          print(json.dumps(data["summary"], indent=2))
          # Always exit 0 — this job is diagnostic; split/pass decisions are made by the agent.
          sys.exit(0)
          PY

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: monshaat-reachability-gate
          path: monshaat_reachability_gate.json
          retention-days: 14

      - name: Print full probe JSON
        run: cat monshaat_reachability_gate.json
